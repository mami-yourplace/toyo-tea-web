<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<h1>🍵 東洋のお茶図鑑</h1>

<p id="teaListTitle">こんなお茶を掲載しています</p>

<div id="teaList"></div>

<p id="searchTitle">気になるお茶を調べる</p>

<input id="keyword" oninput="clearResult()">

<button id="searchButton" onclick="searchTea()">検索</button>

<div id="result"></div>

<p id="constitutionTitle">体質でお茶を調べる</p>

<select id="constitution" onchange="searchConstitution()">
    <option value="">体質を選ぶ</option>
    <option>気虚</option>
    <option>気滞</option>
    <option>血虚</option>
    <option>瘀血</option>
    <option>水滞</option>
</select>

<select id="teaSelect" onchange="showTea()">
    <option value="">お茶を選ぶ</option>
    <!-- JavaScriptでお茶を入れるための空の選択窓 -->
</select>

<button id="resetButton" onclick="resetConstitution()">やり直す</button>

<div id="constitutionResult"></div>

<script src="script.js"></script>
